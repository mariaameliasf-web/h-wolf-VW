<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H Wolf VW Admin</title><style>
:root{--blue:#0b5ed7;--ink:#111827;--muted:#667085;--line:#e5e7eb;--bg:#f7f9fc}*{box-sizing:border-box}body{margin:0;font-family:Arial;color:var(--ink);background:var(--bg)}.wrap{width:min(1100px,92%);margin:35px auto}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 8px 30px rgba(0,0,0,.05)}h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field.full{grid-column:1/-1}label{font-weight:700;font-size:.9rem}input,textarea,button{font:inherit}input,textarea{padding:10px;border:1px solid #cfd6e2;border-radius:8px}textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:8px;padding:10px 15px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.danger{background:#fee2e2;color:#991b1b}.muted{color:var(--muted)}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.item{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}.item img{width:100%;height:140px;object-fit:cover;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chat-layout{display:grid;grid-template-columns:280px 1fr;gap:15px}.threads{border-right:1px solid var(--line);padding-right:12px}.thread{padding:10px;border-radius:8px;cursor:pointer}.thread:hover,.thread.active{background:#edf4ff}.chatbox{min-height:280px;display:flex;flex-direction:column}.msgs{flex:1;max-height:350px;overflow:auto;padding:10px;background:var(--bg);border-radius:10px}.bubble{max-width:80%;padding:9px 11px;border-radius:12px;margin:6px 0;white-space:pre-wrap}.customer{background:#fff;border:1px solid var(--line)}.agent{background:#dfeeff;margin-left:auto}.reply{display:flex;gap:8px;margin-top:10px}.reply input{flex:1}@media(max-width:800px){.grid,.products,.chat-layout{grid-template-columns:1fr}.threads{border-right:0;border-bottom:1px solid var(--line);padding:0 0 10px}.field.full{grid-column:auto}}
</style></head><body><div class="wrap"><div class="card"><h1>H Wolf VW Admin</h1><p class="muted">Products and first-party website chat.</p><div class="field"><label>Admin key</label><input id="key" type="password" placeholder="Your ADMIN_KEY"></div><button class="btn primary" id="connect">Connect</button><span id="status" class="muted"></span></div>
<div id="app" hidden>
<div class="card"><h2>Products</h2><div class="grid"><div class="field"><label>Name</label><input id="name"></div><div class="field"><label>Price</label><input id="price" placeholder="US$ 440 + shipping"></div><div class="field full"><label>Description</label><textarea id="desc"></textarea></div><div class="field full"><label>Product photos</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><small class="muted">Up to 8 images per upload.</small></div></div><button class="btn primary" id="add">Add Product</button></div>
<div id="productList" class="products"></div>
<div class="card"><h2>Customer Chat</h2><div class="chat-layout"><div id="threads" class="threads"></div><div class="chatbox"><div id="chatTitle" class="muted">Select a conversation</div><div id="msgs" class="msgs"></div><div class="reply"><input id="replyText" placeholder="Reply to customer"><button class="btn primary" id="reply">Send</button></div></div></div></div>
</div></div><script>
let key='',selected='';const $=id=>document.getElementById(id);$('connect').onclick=async()=>{key=$('key').value.trim();try{const r=await fetch('/api/admin/products',{headers:{'x-admin-key':key}});if(!r.ok)throw 0;$('app').hidden=false;$('status').textContent=' Connected';loadProducts();loadChats();}catch{$('status').textContent=' Invalid key'}};
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-admin-key':key};return fetch(url,opt)}
async function loadProducts(){const r=await api('/api/admin/products');const ps=await r.json();$('productList').innerHTML=ps.map(p=>`<div class="item"><img src="${p.images?.[0]||''}"><h3>${esc(p.name)}</h3><div>${esc(p.price)}</div><p class="muted">${esc(p.description)}</p><div class="actions"><button class="btn" onclick="toggleProduct('${p.id}',${p.active!==false})">${p.active!==false?'Hide':'Show'}</button><button class="btn danger" onclick="deleteProduct('${p.id}')">Delete</button></div></div>`).join('')}
async function toggleProduct(id,active){await api('/api/admin/products/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({active:!active})});loadProducts()}
async function deleteProduct(id){if(confirm('Delete this product?')){await api('/api/admin/products/'+id,{method:'DELETE'});loadProducts()}}
$('add').onclick=async()=>{const files=[...$('photos').files];let images=[];if(files.length){const payload=[];for(const f of files){const data=await new Promise((ok,bad)=>{const rd=new FileReader();rd.onload=()=>ok(rd.result);rd.onerror=bad;rd.readAsDataURL(f)});payload.push({name:f.name,data})}const r=await api('/api/admin/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({files:payload})});const d=await r.json();images=d.files||[]}const r=await api('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,price:$('price').value,description:$('desc').value,images,active:true})});if(r.ok){$('name').value='';$('price').value='';$('desc').value='';$('photos').value='';loadProducts()}else alert((await r.json()).error||'Could not add product')}
async function loadChats(){const r=await api('/api/admin/chat');const cs=await r.json();$('threads').innerHTML=cs.map(c=>`<div class="thread ${selected===c.conversationId?'active':''}" onclick="selectChat('${c.conversationId}')"><strong>${esc(c.name||'Visitor')}</strong><br><small>${esc(c.email||'')}</small><br><small>${new Date(c.updatedAt).toLocaleString()}</small></div>`).join('');if(selected)renderChat(cs.find(c=>c.conversationId===selected))}
async function selectChat(id){selected=id;loadChats()}
function renderChat(c){if(!c)return;$('chatTitle').textContent=`${c.name||'Visitor'} ${c.email?'• '+c.email:''}`;$('msgs').innerHTML=c.messages.map(m=>`<div class="bubble ${m.role}">${esc(m.message)}</div>`).join('');$('msgs').scrollTop=$('msgs').scrollHeight}
$('reply').onclick=async()=>{const text=$('replyText').value.trim();if(!selected||!text)return;await api('/api/admin/chat/'+selected,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});$('replyText').value='';loadChats()};setInterval(()=>{if(!$('app').hidden){loadChats()}},5000);
function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script></body></html>
